name: Deploy to GitHub Pages

# Builds the single-file bundle and publishes the whole site (index.html +
# css/ + js/ + assets/ + dist/) to GitHub Pages. The landing page is
# index.html — the modular game, which runs fine over HTTPS.
#
# One-time setup: in the repo, go to Settings → Pages → "Build and
# deployment" → Source → select "GitHub Actions". After that this workflow
# publishes automatically on every push to the default branch (and you can
# also run it manually from the Actions tab via "Run workflow").

on:
  push:
    branches: ["claude/video-game-creation-9qho0l"]
  workflow_dispatch:

# Permissions the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys: a new run WAITS for the in-flight one to finish
# rather than cancelling it. GitHub Pages only allows one in-progress
# deployment at a time, so cancelling mid-flight left the server-side
# deployment "in progress" and made the next run fail with a 400 conflict.
# Queueing avoids that race entirely.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild the single-file bundle
        run: node build.js

      - name: Cache-bust asset URLs and stamp the build id
        # Stamp index.html's ?v=… on css/js with this commit's short SHA so
        # returning visitors always fetch the freshly deployed files, and
        # replace the visible "build __BUILD__" marker so the player can see
        # at a glance which version they're actually running.
        run: |
          BUILD="${GITHUB_SHA:0:7}"
          sed -i "s/?v=[0-9A-Za-z]*/?v=${BUILD}/g" index.html
          sed -i "s/__BUILD__/${BUILD}/g" index.html dist/shogun.html dist/artifact.html || true

      - name: Configure Pages
        # Pages is enabled on the repo (Settings → Pages → Source: GitHub Actions),
        # so this just reads the site config; no enablement needed.
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
